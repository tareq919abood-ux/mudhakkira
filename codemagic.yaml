workflows:
  android-workflow:
    name: Android Only Build
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Create android folder
        script: |
          flutter create --platforms=android .
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
